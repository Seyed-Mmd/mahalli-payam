name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "آدرس HTTPS فایل api.php هاست (پیش‌فرض: https://s53.ir/api.php)"
        required: false
        type: string
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: android
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.API_BASE_URL || 'https://s53.ir/api.php' }}
        run: gradle --no-daemon :app:assembleDebug -PapiBaseUrl="${API_BASE_URL}"
      - uses: actions/upload-artifact@v4
        with:
          name: mahalli-payam-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
