<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7f6"><link rel="stylesheet" href="assets/style.css"><title>پیام محلی · آفلاین</title></head><body><main class="container"><section class="hero"><div class="eyebrow">نسخهٔ آفلاین</div><h1>برای ورود به پنل گوشی،<br><span>به شبکهٔ محلی وصل شو</span></h1><p class="lead">لپ‌تاپ را به هات‌اسپات گوشی وصل کن. سپس نشانی محلی‌ای را که برنامهٔ اندروید نشان می‌دهد در مرورگر باز کن.</p><label>نشانی پنل گوشی<input id="local-address" inputmode="url" placeholder="http://192.168.43.1:8765"></label><button class="button" id="open-local">بازکردن پنل محلی</button><p class="muted">این صفحه و فایل‌های اصلی سایت در این دستگاه ذخیره شده‌اند. اطلاعات گوشی از طریق شبکهٔ محلی بارگیری می‌شود.</p></section></main><script>const input=document.querySelector('#local-address');input.value=localStorage.getItem('mahalliLocalAddress')||'';document.querySelector('#open-local').addEventListener('click',()=>{let value=input.value.trim();if(!/^https?:\/\/[\w.-]+(?::\d+)?$/.test(value)){alert('نشانی محلی را کامل وارد کن؛ نمونه: http://192.168.43.1:8765');return}localStorage.setItem('mahalliLocalAddress',value);location.href=value})</script></body></html>
