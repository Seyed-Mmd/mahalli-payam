<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7f6"><title>پنل محلی</title><style>
:root{--bg:#f5f7f6;--ink:#17231f;--muted:#77867f;--line:#e4eae6;--green:#287360;--mint:#e4f3ec;--white:#fff;--shadow:0 12px 34px #173c2c0c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:1280px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;padding:7px 0 20px}.brand{display:flex;align-items:center;gap:11px;font-size:20px;font-weight:800}.mark{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:var(--green);color:white}.local{font-size:12px;color:#286c52;background:var(--mint);padding:7px 12px;border-radius:99px}.layout{display:grid;grid-template-columns:220px 1fr;gap:22px}.side,.panel,.login-card{background:var(--white);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.side{padding:14px;height:max-content;position:sticky;top:18px}.nav{width:100%;border:0;background:transparent;text-align:right;padding:12px;border-radius:12px;color:#596861;font:inherit;cursor:pointer;transition:.18s}.nav:hover,.nav.active{background:var(--mint);color:var(--green);transform:translateX(-2px)}.side-note{border-top:1px solid var(--line);margin-top:12px;padding:13px 8px 2px;color:var(--muted);font-size:12px}.panel{min-height:600px;padding:24px}.heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.heading h1{margin:0;font-size:26px}.sub{color:var(--muted);font-size:13px}.search{width:min(360px,100%);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font:inherit;outline:0;background:#fcfdfc}.search:focus{border-color:var(--green);box-shadow:0 0 0 3px #28736015}.list{display:grid;gap:10px}.row{display:flex;align-items:center;gap:14px;padding:15px;border:1px solid var(--line);border-radius:15px;transition:.2s;animation:appear .3s ease both}.row:hover{border-color:#c9ded3;transform:translateY(-1px)}.avatar{flex:none;width:42px;height:42px;border-radius:14px;background:var(--mint);color:var(--green);display:grid;place-items:center;font-weight:800}.grow{min-width:0;flex:1}.title{font-weight:750;display:flex;gap:8px;align-items:center}.number{color:var(--green);direction:ltr}.body{color:#53645c;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:4px}.date{font-size:11px;color:var(--muted);white-space:nowrap}.empty{padding:60px 15px;text-align:center;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:13px}.tile{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;cursor:pointer;transition:.2s}.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.thumb{width:100%;aspect-ratio:1.15;object-fit:cover;background:#edf2ef;display:block}.tile-name{padding:9px 10px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.folder{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:13px;color:var(--ink);text-decoration:none}.folder:hover{background:#f8fbf9}.folder-icon{font-size:22px}.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 14px;color:var(--muted);font-size:13px}.crumbs button{border:0;background:none;color:var(--green);cursor:pointer;font:inherit}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{border:1px solid var(--line);background:white;border-radius:99px;padding:7px 12px;cursor:pointer;font:inherit}.tab.active{background:var(--green);color:white;border-color:var(--green)}.modal{position:fixed;inset:0;background:#101d18ba;display:none;align-items:center;justify-content:center;padding:20px;z-index:4}.modal.open{display:flex;animation:fade .2s}.modal-box{max-width:min(1000px,95vw);max-height:92vh;background:white;border-radius:18px;overflow:auto;padding:14px}.modal-box img,.modal-box video,.modal-box iframe{display:block;max-width:100%;max-height:78vh;border:0;margin:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 10px}.close{border:0;background:#eef2ef;border-radius:9px;padding:7px 11px;cursor:pointer}.login-layer{position:fixed;inset:0;background:#f5f7f6f2;backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:8}.login-card{width:min(390px,100%);background:white;border:1px solid var(--line);box-shadow:0 25px 80px #173c2c18;border-radius:22px;padding:28px;animation:appear .35s}.login-card h1{margin:8px 0 3px}.login-card p{color:var(--muted);font-size:13px}.login-card input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font:inherit;margin:10px 0 12px}.login-card button{width:100%;border:0;border-radius:12px;background:var(--green);color:white;padding:13px;font:700 15px system-ui;cursor:pointer}.msg{color:#a13e46;min-height:22px;font-size:13px}.download{display:inline-flex;background:var(--green);color:white;padding:8px 12px;border-radius:10px;text-decoration:none;font-size:12px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.hidden{display:none!important}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@media(max-width:760px){.shell{padding:12px}.layout{grid-template-columns:1fr;gap:12px}.side{position:static;display:flex;overflow:auto;padding:7px}.nav{white-space:nowrap;text-align:center;width:auto}.side-note{display:none}.panel{padding:16px;min-height:70vh}.heading{align-items:flex-start;flex-direction:column}.heading h1{font-size:23px}.search{width:100%}.date{display:none}.grid{grid-template-columns:repeat(auto-fill,minmax(115px,1fr))}}
</style></head><body>
<div class="shell"><header class="top"><div class="brand"><span class="mark">م</span> پیام محلی</div><span class="local">● اتصال فقط در شبکهٔ گوشی</span></header><div class="layout"><aside class="side"><button class="nav active" data-view="sms">✉　پیامک‌ها</button><button class="nav" data-view="contacts">♙　مخاطبین</button><button class="nav" data-view="files">▤　فایل‌ها</button><button class="nav" data-view="gallery">▧　گالری</button><div class="side-note">پنل محلی · قفل خودکار هر ۵ دقیقه</div></aside><main class="panel"><div id="content"></div></main></div></div>
<div id="modal" class="modal"><div class="modal-box"><div class="modal-head"><strong id="modal-title"></strong><button class="close" onclick="closeModal()">بستن</button></div><div id="modal-body"></div></div></div>
<div id="login" class="login-layer"><form class="login-card" id="login-form"><div class="mark">م</div><h1>ورود به پنل گوشی</h1><p>رمزی را وارد کن که در برنامهٔ گوشی تعیین کرده‌ای.</p><input type="password" inputmode="numeric" minlength="8" placeholder="رمز محلی" required autofocus><div id="login-msg" class="msg"></div><button>بازکردن پنل</button></form></div>
<script>
const $=s=>document.querySelector(s), content=$('#content');let view='sms',path='',lockTimer,sessionDeadline=0;const qs=o=>new URLSearchParams(o).toString();
async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',cache:'no-store',...opts});if(r.status===401){lock();throw Error('locked')}if(r.status===403){content.innerHTML=empty('دسترسی حساب یا دستگاه از سمت سایت لغو شده است. برای اتصال دوباره با مدیر تماس بگیر.');throw Error('access_revoked')}if(!r.ok)throw Error('دریافت اطلاعات ناموفق بود.');return r.headers.get('content-type')?.includes('application/json')?r.json():r}
function armLock(){clearTimeout(lockTimer);sessionDeadline=Date.now()+5*60*1000;lockTimer=setTimeout(()=>{fetch('/api/local/logout',{method:'POST',credentials:'same-origin'}).finally(lock)},5*60*1000)}function lock(){clearTimeout(lockTimer);content.replaceChildren();closeModal();$('#login').classList.remove('hidden');$('#login-msg').textContent='برای ادامه رمز را دوباره وارد کن.';$('#login-form input').value=''}document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&sessionDeadline&&Date.now()>=sessionDeadline)lock()});
$('#login-form').addEventListener('submit',async e=>{e.preventDefault();const pin=$('#login-form input').value;$('#login-msg').textContent='';try{await api('/api/local/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin})});$('#login').classList.add('hidden');armLock();loadView()}catch{$('#login-msg').textContent='رمز درست نیست یا دسترسی موقتاً قفل شده است.'}});
function fmt(t){try{return new Date(Number(t)).toLocaleString('fa-IR',{dateStyle:'short',timeStyle:'short'})}catch{return''}}function safeText(s){return String(s||'')}
function header(title,desc,search=true){return `<div class="heading"><div><h1>${title}</h1><div class="sub">${desc}</div></div>${search?'<input class="search" id="search" placeholder="جست‌وجو…">':''}</div>`}
function empty(text){return `<div class="empty">${text}</div>`}
async function loadView(){document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.view===view));try{if(view==='sms')await loadSms();if(view==='contacts')await loadContacts();if(view==='files')await loadFiles(path);if(view==='gallery')await loadGallery()}catch(e){if(e.message==='access_revoked')content.innerHTML=empty('دسترسی حساب یا دستگاه از سمت سایت لغو شده است. برای اتصال دوباره با مدیر تماس بگیر.');else if(e.message!=='locked')content.innerHTML=empty('اطلاعات در دسترس نیست. اتصال محلی و مجوزهای گوشی را بررسی کن.')}}
async function loadSms(q=''){content.innerHTML=header('پیامک‌ها','نمایش همهٔ پیامک‌های گوشی همراه نام مخاطب')+'<div class="list" id="list"></div><div id="more"></div>';let offset=0;const append=async reset=>{if(reset){offset=0;$('#list').replaceChildren();$('#more').replaceChildren()}try{const rows=await api('/api/sms?'+qs({q:q||'',offset}));$('#list').insertAdjacentHTML('beforeend',rows.map((m,i)=>`<article class="row" style="animation-delay:${Math.min(i*15,180)}ms"><div class="avatar">${m.type===2?'↗':'↙'}</div><div class="grow"><div class="title">${esc(m.name||'بدون نام')} <span class="number">${esc(m.number)}</span></div><div class="body">${esc(m.body)}</div></div><time class="date">${fmt(m.date)}</time></article>`).join(''));offset+=rows.length;$('#more').replaceChildren();if(rows.length===100)$('#more').innerHTML='<button class="tab" id="load-more">پیام‌های قدیمی‌تر</button>';const b=$('#load-more');if(b)b.onclick=()=>append(false);if(reset&&rows.length===0)$('#list').innerHTML=empty('پیامکی پیدا نشد.')}catch{}};await append(true);let timer;$('#search').addEventListener('input',e=>{clearTimeout(timer);timer=setTimeout(()=>{q=e.target.value;append(true)},300)})}async function loadContacts(){content.innerHTML=header('مخاطبین','نام‌ها و شماره‌های ذخیره‌شده در گوشی')+'<div class="list" id="list"></div>';const rows=await api('/api/contacts');const draw=q=>{$('#list').innerHTML=rows.filter(x=>(x.name+' '+x.number).includes(q)).map(x=>`<article class="row"><div class="avatar">${esc((x.name||x.number||'؟').slice(0,1))}</div><div class="grow"><div class="title">${esc(x.name||'بدون نام')}</div><div class="number">${esc(x.number)}</div></div></article>`).join('')||empty('مخاطبی پیدا نشد.')};draw('');$('#search').addEventListener('input',e=>draw(e.target.value))}
let fileOffset=0;async function loadFiles(p='',more=false){path=p;if(!more){fileOffset=0;content.innerHTML=header('فایل‌ها','مشاهده و دانلود؛ حذف و ویرایش در پنل وجود ندارد.',false)+'<div class="crumbs" id="crumbs"></div><div class="list" id="list"></div><div id="more"></div>';const crumbs=p?p.split('/'):[];$('#crumbs').innerHTML=`<button data-path="">حافظهٔ گوشی</button>`+crumbs.map((x,i)=>` / <button data-path="${esc(crumbs.slice(0,i+1).join('/'))}">${esc(x)}</button>`).join('');$('#crumbs').querySelectorAll('button').forEach(b=>b.onclick=()=>loadFiles(b.dataset.path))}const rows=await api('/api/files?'+qs({path:p,offset:fileOffset}));fileOffset+=rows.length;const html=rows.map(x=>x.directory?`<button class="folder" data-path="${esc(x.path)}"><span class="folder-icon">📁</span><span class="grow">${esc(x.name)}</span><span>›</span></button>`:`<article class="row"><div class="avatar">▤</div><div class="grow"><div class="title" data-preview="${esc(x.path)}" data-name="${esc(x.name)}" data-mime="${esc(x.mime)}">${esc(x.name)}</div><div class="sub">${fmt(x.modified)} · ${size(x.size)}</div></div><a class="download" href="/api/file?${qs({path:x.path})}" download>دانلود</a></article>`).join('');if(more)$('#list').insertAdjacentHTML('beforeend',html);else $('#list').innerHTML=html||empty('پوشه خالی است یا مجوز دسترسی ندارد.');$('#list').querySelectorAll('button.folder').forEach(b=>b.onclick=()=>loadFiles(b.dataset.path));$('#list').querySelectorAll('[data-preview]').forEach(el=>el.onclick=()=>{previewFile({path:el.dataset.preview,name:el.dataset.name,mime:el.dataset.mime})});$('#more').replaceChildren();if(rows.length===200)$('#more').innerHTML='<button class="tab" id="load-more">موارد بیشتر</button>';const b=$('#load-more');if(b)b.onclick=()=>loadFiles(path,true)}async function loadGallery(){content.innerHTML=header('گالری','پیش‌نمایش و دانلود عکس‌ها و ویدیوها')+'<div class="tabs"><button class="tab active" data-filter="all">همه</button><button class="tab" data-filter="image">عکس‌ها</button><button class="tab" data-filter="video">ویدیوها</button></div><div class="grid" id="grid"></div><div id="more"></div>';let offset=0,filter='all';const load=async reset=>{if(reset){offset=0;$('#grid').replaceChildren();$('#more').replaceChildren()}const rows=await api('/api/media?'+qs({offset}));offset+=rows.length;const list=filter==='all'?rows:rows.filter(x=>x.type===filter);$('#grid').insertAdjacentHTML('beforeend',list.map(m=>{const src='/api/media/file?'+qs({id:m.id,type:m.type});return `<article class="tile" data-id="${m.id}" data-type="${m.type}" data-name="${esc(m.name)}">${m.type==='video'?`<div class="thumb" style="display:grid;place-items:center;font-size:32px">▶</div>`:`<img class="thumb" loading="lazy" src="${src}" alt="">`}<div class="tile-name">${esc(m.name)}</div></article>`}).join(''));$('#grid').querySelectorAll('.tile').forEach(el=>el.onclick=()=>openMedia(el.dataset.id,el.dataset.type,el.dataset.name));$('#more').replaceChildren();if(rows.length===200)$('#more').innerHTML='<button class="tab" id="load-more">موارد بیشتر</button>';const b=$('#load-more');if(b)b.onclick=()=>load(false);if(reset&&rows.length===0)$('#grid').innerHTML=empty('رسانه‌ای پیدا نشد.')};await load(true);document.querySelectorAll('.tab[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.tab[data-filter]').forEach(x=>x.classList.toggle('active',x===b));load(true)})}function esc(s){return safeText(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function size(n){n=Number(n||0);return n<1024?n+' بایت':n<1048576?(n/1024).toFixed(1)+' کیلوبایت':(n/1048576).toFixed(1)+' مگابایت'}
function openMedia(id,type,name){$('#modal-title').textContent=name;const src='/api/media/file?'+qs({id,type});$('#modal-body').innerHTML=(type==='video'?`<video controls autoplay playsinline src="${src}"></video>`:`<img src="${src}" alt="">`)+`<p style="text-align:center"><a class="download" href="${src}" download>دانلود ${type==='video'?'ویدیو':'عکس'}</a></p>`;$('#modal').classList.add('open')}function previewFile(x){$('#modal-title').textContent=x.name;const url='/api/file?'+qs({path:x.path});const mime=x.mime||'';$('#modal-body').innerHTML=mime.startsWith('image/')?`<img src="${url}">`:mime==='application/pdf'?`<iframe src="${url}" width="900" height="700"></iframe>`:`<p>پیش‌نمایش این نوع فایل در مرورگر پشتیبانی نمی‌شود.</p><a class="download" href="${url}" download>دانلود فایل</a>`;$('#modal').classList.add('open')}function closeModal(){$('#modal').classList.remove('open');$('#modal-body').replaceChildren()}$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{view=b.dataset.view;path='';loadView()});loadView();
</script></body></html>
